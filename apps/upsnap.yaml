apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: upsnap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/danxtrate/homelab-gitops.git
    targetRevision: main
    path: workloads/upsnap
  destination:
    server: https://kubernetes.default.svc
    namespace: upsnap
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
