apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-webapp
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-webapp
  template:
    metadata:
      labels:
        app: fastapi-webapp
    spec:
      containers:
      - name: webapp
        image: ghcr.io/danxtrate/homelab-webapp/webapp:372d5e0ae96591c85be5bfd954f8017948cd675e
        ports:
        - containerPort: 8000
